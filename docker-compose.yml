services:
  postgres:
    image: postgres:15-alpine
    container_name: contact-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: axumdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - contact-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contact-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/axumdb
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      JWT_SECRET: contact_manager_secret_key_2024_very_secure_and_long_string_for_jwt
      LOG_LEVEL: info
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contact-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contact-web
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000/api
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - contact-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  contact-network:
    driver: bridge
